services:
  web:
    build: ./Backend
    command: >
      sh -c "python manage.py migrate &&
             gunicorn PayFlow_Store.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./Backend:/app
    depends_on:
      - db
      - redis

  celery:
    build: ./Backend
    command: celery -A PayFlow_Store worker --loglevel=info
    env_file:
      - ./Backend/.env
    environment:
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./Backend:/app
    depends_on:
      - db
      - redis
      - web

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=payflow_db
      - POSTGRES_USER=payflow_user
      - POSTGRES_PASSWORD=payflow_pass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
