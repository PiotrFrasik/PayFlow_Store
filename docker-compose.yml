version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=payflow_db
      - POSTGRES_USER=payflow_user
      - POSTGRES_PASSWORD=payflow_pass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
